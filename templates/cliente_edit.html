{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">

                <div class="card-header bg-warning text-white">
                    <h2 class="text-center mb-0">Editar Cliente</h2>
                </div>

                <div class="card-body">
                    <form method="post" action="/clientes/editar/{{ cliente.id }}" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" name="nombre" value="{{ cliente.nombre }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" name="telefono" value="{{ cliente.telefono }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo</label>
                            <input type="email" class="form-control" name="correo" value="{{ cliente.correo }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Año</label>
                            <input type="number" class="form-control" name="anio" value="{{ cliente.anio }}">
                        </div>

                        {% if cliente.img %}
                        <p>Imagen actual:</p>
                        <img src="{{ cliente.img }}" width="120">
                        {% endif %}

                        <div class="mb-3">
                            <label class="form-label">Subir nueva imagen</label>
                            <input type="file" class="form-control" name="img">
                        </div>

                        <button class="btn btn-warning w-100">Guardar cambios</button>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
