{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-warning">
            <h3 class="mb-0 text-center">Editar Cliente</h3>
        </div>

        <div class="card-body">

            <form method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" name="correo" class="form-control" value="{{ cliente.correo }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Año</label>
                    <input type="number" name="anio" class="form-control" value="{{ cliente.anio }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagen actual</label><br>

                    {% if cliente.img %}
                        <img src="{{ cliente.img }}" class="img-thumbnail" width="120">
                    {% else %}
                        <p class="text-muted">Sin imagen</p>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label class="form-label">Cambiar imagen</label>
                    <input type="file" name="img" class="form-control">
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/clientes" class="btn btn-secondary">🔙 Volver</a>
                    <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
                </div>

            </form>

        </div>
    </div>
</div>

{% include 'footer.html' %}
