{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-5">
    <h2 class="mb-3">Mecánicos Eliminados</h2>

    <a href="/mecanicos" class="btn btn-secondary mb-3">⬅ Volver</a>

    <div class="row">
        {% for mecanico in mecanicos %}
        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="card-title">{{ mecanico.nombre }}</h5>
                    <p class="card-text"><strong>Especialidad:</strong> {{ mecanico.especialidad }}</p>

                    <a href="/mecanicos/restaurar/{{ mecanico.id }}" class="btn btn-success btn-sm">
                        Restaurar
                    </a>
                </div>
            </div>
        </div>
        {% else %}
        <p class="text-muted">No hay mecánicos eliminados.</p>
        {% endfor %}
    </div>
</div>

{% include 'footer.html' %}
