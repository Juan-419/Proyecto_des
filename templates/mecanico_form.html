{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-5">

    <h2>{{ titulo }}</h2>

    <form method="post">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ mecanico.nombre if mecanico else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Especialidad</label>
            <input type="text" name="especialidad" class="form-control" value="{{ mecanico.especialidad if mecanico else '' }}">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/mecanicos/" class="btn btn-secondary">Cancelar</a>

    </form>

</div>

{% include 'footer.html' %}
