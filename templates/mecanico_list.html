{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-4">
    <h2>Mecánicos registrados</h2>

    <a href="/mecanicos/new" class="btn btn-primary mb-3">➕ Nuevo Mecánico</a>

    <ul class="list-group">
        {% for m in mecanicos %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>👨‍🔧 {{ m.nombre }} — {{ m.especialidad }}</span>

            <span>
                <a href="/mecanicos/editar/{{ m.id }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="/mecanicos/eliminar/{{ m.id }}" class="btn btn-danger btn-sm">Eliminar</a>
            </span>
        </li>
        {% endfor %}
    </ul>
</div>

{% include 'footer.html' %}
