{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-5">

    <h2>Mecánicos Eliminados</h2>

    <a href="/mecanicos" class="btn btn-secondary mb-3">⬅ Volver</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Restaurar</th>
            </tr>
        </thead>

        <tbody>
            {% for mecanico in mecanicos %}
            <tr>
                <td>{{ mecanico.nombre }}</td>
                <td>{{ mecanico.especialidad }}</td>

                <td>
                    <a href="/mecanicos/restaurar/{{ mecanico.id }}" class="btn btn-success btn-sm">
                        Restaurar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% include 'footer.html' %}
