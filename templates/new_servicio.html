{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h2 class="text-center mb-0">Registrar Nuevo Servicio</h2>
                </div>
                <div class="card-body">
                    {% if carro_id %}
                    <p class="text-center text-muted">Asociado al Vehículo ID: <strong>{{ carro_id }}</strong></p>
                    {% else %}
                    <div class="alert alert-danger" role="alert">
                        <strong>Error:</strong> Se debe especificar el ID del vehículo.
                    </div>
                    {% endif %}

                    {% if carro_id %}
                    <form method="post" action="/servicios/">
                        
                        <!-- Campo oculto para carro_id -->
                        <input type="hidden" name="carro_id" value="{{ carro_id }}">
                        
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción del Servicio</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required placeholder="Ej: Cambio de aceite y filtro, revisión de frenos."></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="costo" class="form-label">Costo Estimado (USD)</label>
                            <input type="number" step="0.01" class="form-control" id="costo" name="costo" required min="0" placeholder="Ej: 150.00">
                        </div>

                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado Inicial</label>
                            <select class="form-select" id="estado" name="estado" required>
                                <option value="Pendiente" selected>Pendiente</option>
                                <option value="En Progreso">En Progreso</option>
                                <option value="Finalizado">Finalizado</option>
                            </select>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-info btn-lg text-white">
                                Registrar Servicio
                            </button>
                            <a href="/servicios/carro/{{ carro_id }}" class="btn btn-outline-secondary">
                                Cancelar y Volver
                            </a>
                        </div>
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
