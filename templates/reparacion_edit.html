{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-4">

    <h2>Editar Reparación #{{ reparacion.id }}</h2>

    <form method="post">

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" name="descripcion" class="form-control" required value="{{ reparacion.descripcion }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control" required value="{{ reparacion.fecha }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Costo</label>
            <input type="number" step="0.01" name="costo" class="form-control" required value="{{ reparacion.costo }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Carro</label>
            <select name="carro_id" class="form-select" required>
                {% for carro in carros %}
                    <option value="{{ carro.id }}" {% if carro.id == reparacion.carro_id %}selected{% endif %}>
                        {{ carro.marca }} {{ carro.modelo }} - {{ carro.placa }} ({{ carro.cliente.nombre }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Mecánicos asignados</label><br>

            {% for m in mecanicos %}
                <label class="me-2">
                    <input type="checkbox" name="mecanico_ids" value="{{ m.id }}"
                        {% if m.id in reparacion_mecanicos %}checked{% endif %}>
                    {{ m.nombre }}
                </label>
            {% endfor %}
        </div>

        <button class="btn btn-primary w-100" type="submit">Guardar Cambios</button>

    </form>

</div>

{% include 'footer.html' %}
