{% include 'header.html' %}
{% include 'navbar.html' %}

<div class="container mt-4">

    <h2>Nueva Reparación</h2>

    <form method="post" action="/reparaciones/">

        <div class="mb-3">
            <label class="form-label">Carro</label>
            <select name="carro_id" class="form-select" required>
                <option value="">Seleccione un carro</option>
                {% for carro in carros %}
                    <option value="{{ carro.id }}">
                        {{ carro.marca }} {{ carro.modelo }} - {{ carro.placa }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea name="descripcion" class="form-control" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Costo</label>
            <input type="number" name="costo" step="0.01" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mecánicos</label>
            <select name="mecanico_ids" class="form-select" multiple>
                {% for mecanico in mecanicos %}
                    <option value="{{ mecanico.id }}">
                        {{ mecanico.nombre }} ({{ mecanico.especialidad }})
                    </option>
                {% endfor %}
            </select>
            <small class="form-text">Mantén CTRL para seleccionar varios.</small>
        </div>

        <button class="btn btn-primary" type="submit">Guardar Reparación</button>
    </form>

</div>

{% include 'footer.html' %}
